<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل الدخول إلى منصة PalPrints للطباعة حسب الطلب">
  <title>تسجيل الدخول | PalPrints</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/pages/login.css">
</head>

<body class="login-page">
  <main class="auth-layout">
    <section class="auth-visual" aria-label="منتجات مطبوعة من PalPrints">
      <img
        src="./public/images/pal-print-login-real.png"
        alt="موظفة في مطبعة حديثة تتفقد قميصاً مطبوعاً بجانب مجموعة من منتجات PalPrints"
        class="auth-visual__image"
      >

      <div class="auth-visual__overlay" aria-hidden="true"></div>

      <div class="auth-visual__content">
        <h2>من الفكرة <span>للطباعة</span></h2>
        <p><strong>كل ما تحتاجه لتحويل تصميمك إلى منتج مميز</strong></p>
        <p>اختر منتجك، أضف تصميمك، واترك لنا مهمة الطباعة بجودة واهتمام بكل تفصيل.</p>
      </div>
    </section>

    <section class="auth-panel" aria-labelledby="login-title">
      <a href="./index.html" class="auth-wordmark" aria-label="العودة إلى الصفحة الرئيسية لـ PalPrints">
        <img src="./assets/images/palprints-wordmark-approved.png" alt="PalPrints">
      </a>

      <div class="auth-panel__inner">
        <div class="auth-heading">
          <h1 id="login-title">مرحباً <span>بعودتك</span></h1>
          <p>سجّل الدخول للمتابعة إلى حسابك في PalPrints.</p>
        </div>

        <form class="login-form" id="loginForm" action="#" method="post" novalidate>
          <div class="form-field">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-control">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@example.com"
                autocomplete="email"
                inputmode="email"
                required
                aria-describedby="emailError"
              >
            </div>
            <span class="field-error" id="emailError" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="password">كلمة المرور</label>
            <div class="input-control">
              <i class="bi bi-lock" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                minlength="6"
                required
                aria-describedby="passwordError"
              >
              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="إظهار كلمة المرور"
                aria-pressed="false"
              >
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field-error" id="passwordError" aria-live="polite"></span>
          </div>

          <div class="form-options">
            <label class="remember-option">
              <input type="checkbox" name="remember">
              <span>تذكرني</span>
            </label>
            <a href="#">نسيت كلمة المرور؟</a>
          </div>

          <button type="submit" class="submit-button">
            <span>تسجيل الدخول</span>
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
          </button>

          <div class="social-login" aria-label="خيارات تسجيل الدخول عبر حساب اجتماعي">
            <button type="button" class="social-login__button social-login__button--google" aria-label="تسجيل الدخول باستخدام Google">
              <i class="bi bi-google" aria-hidden="true"></i>
            </button>
            <button type="button" class="social-login__button social-login__button--facebook" aria-label="تسجيل الدخول باستخدام Facebook">
              <i class="bi bi-facebook" aria-hidden="true"></i>
            </button>
            <button type="button" class="social-login__button social-login__button--apple" aria-label="تسجيل الدخول باستخدام Apple">
              <i class="bi bi-apple" aria-hidden="true"></i>
            </button>
          </div>

          <p class="signup-prompt">
            ليس لديك حساب؟
            <a href="./register.html">أنشئ حساباً جديداً</a>
          </p>

          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

          <p class="auth-footer">
            <i class="bi bi-shield-check" aria-hidden="true"></i>
            اتصال آمن · جميع عمليات الدخول مسجلة
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="./assets/js/pages/login.js"></script>
</body>
</html>
