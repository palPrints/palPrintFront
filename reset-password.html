<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="إعادة تعيين كلمة مرور حساب PalPrints">
  <title>إعادة تعيين كلمة المرور | PalPrints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/pages/forgot-password.css">
</head>
<body>
  <main class="recovery-layout">
    <section class="recovery-panel" aria-labelledby="resetTitle">
      <a href="./index.html" class="recovery-wordmark" aria-label="العودة إلى الصفحة الرئيسية">
        <img src="./assets/images/palprints-wordmark-approved.png" alt="PalPrints">
      </a>

      <div class="recovery-card">
        <div class="recovery-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></div>
        <header class="recovery-heading">
          <span class="eyebrow">حماية حسابك</span>
          <h1 id="resetTitle">إعادة تعيين <span>كلمة المرور</span></h1>
          <p>اختر كلمة مرور قوية وجديدة لحماية حسابك.</p>
        </header>

        <form id="resetPasswordForm" class="reset-form" novalidate>
          <div class="form-field">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <div class="input-control">
              <i class="bi bi-lock" aria-hidden="true"></i>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل" aria-describedby="newPasswordError" required>
              <button class="password-toggle" type="button" data-target="newPassword" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
            </div>
            <span class="field-error" id="newPasswordError" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <div class="input-control">
              <i class="bi bi-shield-check" aria-hidden="true"></i>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" aria-describedby="confirmPasswordError" required>
              <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
            </div>
            <span class="field-error" id="confirmPasswordError" aria-live="polite"></span>
          </div>

          <button class="submit-button" type="submit">
            <span>تعيين كلمة المرور الجديدة</span>
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
          </button>
          <p class="security-note"><i class="bi bi-shield-check" aria-hidden="true"></i> استخدم 8 أحرف على الأقل ولا تشارك كلمة مرورك مع أحد.</p>
        </form>

        <div class="success-state" id="successState" role="status" aria-live="polite" hidden>
          <span class="success-icon"><i class="bi bi-check-lg"></i></span>
          <h2>تم تغيير كلمة المرور</h2>
          <p>يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p>
          <a class="success-action" href="./login.html">الانتقال إلى تسجيل الدخول</a>
        </div>

        <a class="back-link" id="resetBackLink" href="./login.html"><i class="bi bi-arrow-right" aria-hidden="true"></i> العودة إلى تسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script src="./assets/js/pages/reset-password.js"></script>
</body>
</html>
