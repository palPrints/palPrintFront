<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="استعادة كلمة مرور حساب PalPrints">
  <title>نسيت كلمة المرور | PalPrints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/pages/forgot-password.css">
</head>
<body>
  <main class="recovery-layout">
    <section class="recovery-panel" aria-labelledby="recoveryTitle">
      <a href="./index.html" class="recovery-wordmark" aria-label="العودة إلى الصفحة الرئيسية">
        <img src="./assets/images/palprints-wordmark-approved.png" alt="PalPrints">
      </a>

      <div class="recovery-card">
        <div class="recovery-icon" aria-hidden="true"><i class="bi bi-key"></i></div>
        <header class="recovery-heading">
          <span class="eyebrow">استعادة الحساب</span>
          <h1 id="recoveryTitle">نسيت كلمة <span>المرور؟</span></h1>
          <p>أدخل البريد الإلكتروني المرتبط بحسابك وسنرسل لك رمز التحقق.</p>
        </header>

        <form id="recoveryForm" novalidate>
          <div class="form-field">
            <label for="recoveryEmail">البريد الإلكتروني</label>
            <div class="input-control">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input id="recoveryEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" aria-describedby="emailError" required>
            </div>
            <span class="field-error" id="emailError" aria-live="polite"></span>
          </div>

          <button class="submit-button" type="submit">
            <span>إرسال رمز التحقق</span>
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
          </button>
          <p class="security-note"><i class="bi bi-shield-check" aria-hidden="true"></i> الرمز صالح لفترة محدودة حفاظًا على أمان حسابك.</p>
        </form>

        <div class="success-state" id="successState" role="status" aria-live="polite" hidden>
          <span class="success-icon"><i class="bi bi-envelope-check"></i></span>
          <h2>تحقق من بريدك الإلكتروني</h2>
          <p>أرسلنا رمز التحقق إلى <strong id="sentEmail"></strong></p>
          <button type="button" id="resendButton">إعادة إرسال الرمز</button>
        </div>

        <a class="back-link" href="./login.html"><i class="bi bi-arrow-right" aria-hidden="true"></i> العودة إلى تسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script src="./assets/js/pages/forgot-password.js"></script>
</body>
</html>
