<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="استعادة كلمة مرور حساب PALPRINTS.">
  <meta name="theme-color" content="#f8fafc">
  <meta name="color-scheme" content="light dark">
  <title>نسيت كلمة المرور | PALPRINTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=block" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="auth-flow.js" defer></script>
</head>
<body class="login-page auth-flow-page forgot-password-page" data-auth-flow="forgot-password-page">
  <a class="skip-link" href="#main-content" data-i18n="skipToContent">انتقل إلى المحتوى الرئيسي</a>
  <div class="auth-topbar">
    <div class="auth-topbar__container">
      <span class="brand" role="img" aria-label="PALPRINTS">
        <img class="brand-logo brand-logo-light" src="assets/images/palprintLogo-removebg-preview.png" alt="شعار PALPRINTS" width="140" height="55">
        <img class="brand-logo brand-logo-dark" src="assets/images/palprintLogo-removebg-preview.png" alt="" aria-hidden="true" width="140" height="55">
      </span>
      <nav class="auth-topbar__actions" aria-label="خيارات الواجهة" data-i18n-aria-label="headerNavLabel">
        <button class="header-control language-toggle" id="languageToggle" type="button" aria-label="تغيير اللغة إلى الإنجليزية" data-i18n-aria-label="languageToggleLabel">
          <span aria-hidden="true" class="icon external-ui-icon icon-language"></span>
          <span id="languageToggleText">English</span>
        </button>
        <button class="header-control theme-toggle" id="themeToggle" type="button" aria-label="تفعيل الوضع الليلي" aria-pressed="false">
          <span aria-hidden="true" class="icon external-ui-icon icon-sun theme-icon theme-icon-light"></span>
          <span aria-hidden="true" class="icon external-ui-icon icon-moon theme-icon theme-icon-dark"></span>
          <span class="visually-hidden" data-i18n="themeToggleText">تبديل المظهر</span>
        </button>
      </nav>
    </div>
  </div>
  <main class="main-content" id="main-content" tabindex="-1">
    <div class="auth-layout">
      <aside class="auth-visual-panel" aria-labelledby="flow-visual-title">
        <div class="auth-visual-inner">
          <div class="auth-visual-copy">
            <p class="auth-visual-kicker" data-i18n="visualKicker">PALPRINTS</p>
            <h2 id="flow-visual-title" data-i18n="visualTitle">مساحة تجمع الإبداع والطباعة</h2>
            <p class="auth-visual-description" data-i18n="visualDescription">اكتشف عالمًا تتحول فيه التصاميم إلى منتجات حقيقية.</p>
          </div>
        </div>
      </aside>
      <div class="auth-form-panel">
        <section class="login-card auth-flow-card" aria-labelledby="forgot-title">
          <div class="auth-step-badge" aria-hidden="true">1</div>
          <header class="register-heading auth-flow-heading">
            <p class="eyebrow" data-i18n="eyebrow">استعادة الحساب</p>
            <h1 id="forgot-title" data-i18n="pageHeading">نسيت كلمة المرور؟</h1>
            <p class="register-subtitle" data-i18n="pageSubtitle">أدخل البريد الإلكتروني المرتبط بحسابك وسنرسل لك رمز تحقق.</p>
          </header>
          <form class="login-form" id="forgotPasswordForm" novalidate>
            <div class="field-group">
              <div class="floating-field">
                <input id="recoveryEmail" name="email" type="email" placeholder=" " autocomplete="email" required aria-describedby="recoveryEmailError">
                <label for="recoveryEmail" data-i18n="email">البريد الإلكتروني</label>
                <span class="required-mark" aria-hidden="true">*</span>
              </div>
              <p class="field-error" id="recoveryEmailError" aria-live="polite"></p>
            </div>
            <div class="form-status" id="flowStatus" role="status" aria-live="polite"></div>
            <button class="primary-button submit-button" type="submit">
              <span data-i18n="sendCode">إرسال رمز التحقق</span>
              <span class="button-loader" aria-hidden="true"></span>
            </button>
          </form>
          <p class="login-footer"><a href="login.html" data-i18n="backToLogin">العودة إلى تسجيل الدخول</a></p>
        </section>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <p><span>©</span> <span id="currentYear">2026</span> <strong>PALPRINTS</strong> <span data-i18n="allRightsReserved">جميع الحقوق محفوظة.</span></p>
  </footer>
</body>
</html>
